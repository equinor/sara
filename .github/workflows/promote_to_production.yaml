name: Promote to Production

permissions:
  contents: read
  pull-requests: read
  packages: write

# Only one workflow in a concurrency group may run at a time
concurrency:
  group: production-concurrency
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  get_staging_version:
    name: Get version from staging
    outputs:
      versionTag: ${{ steps.get_version_tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          ref: main
          repository: equinor/robotics-infrastructure
          ssh-key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}

      - name: Get SARA version in staging
        id: get_version_tag
        # Search for the exact line referring to the sara image to avoid getting the other
        # lines containing sara (e.g. sara-anonymizer)
        run: |
          TAG_LINE_NUMBER=$(($(grep -n -x "  newName: roboticsstagingacr.azurecr.io/robotics/sara" k8s_kustomize/analytics/overlays/staging/kustomization.yaml |  cut --delimiter=":" --fields=1)+1))
          VERSION_TAG=$(sed -n "${TAG_LINE_NUMBER}p" k8s_kustomize/analytics/overlays/staging/kustomization.yaml | awk -F': ' '{print $2}' | tr -d ' ')
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

  run_migrations:
    name: Update database in Production
    needs: get_staging_version
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: equinor/armada/.github/workflows/run_dotnet_migrations.yml@main
    with:
      environment: Production
      checkout_ref: ${{ needs.get_staging_version.outputs.versionTag }}
      working_directory: api
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  copy-images-to-robotics-prod-registry:
    name: Copy staging images to robotics prod registry
    needs: get_staging_version
    strategy:
      matrix:
        image_name: ['robotics/sara', 'robotics/workflow-notifier']
    permissions:
      contents: read
      # Declared by the shared workflow for its OIDC path; a called
      # workflow can never exceed the calling job.
      id-token: write
    uses: equinor/armada/.github/workflows/copy_image_between_registries.yml@main
    with:
      source_registry: roboticsstagingacr.azurecr.io
      destination_registry: roboticsprodacr.azurecr.io
      image_name: ${{ matrix.image_name }}
      tag: ${{ needs.get_staging_version.outputs.versionTag }}
      # Authenticate to both registries with a federated credential
      # instead of the registry passwords. The identity holds AcrPull
      # on staging and AcrPush on production, because promotion reads
      # from one and writes to the other.
      use_oidc: true
      environment: Production
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy:
    name: Update deployment in Production
    needs: [get_staging_version, copy-images-to-robotics-prod-registry]
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    strategy:
      max-parallel: 1
      matrix:
        include:
          - image_name: robotics/sara
          - image_name: robotics/workflow-notifier
    with:
      environment: production
      tag: ${{ needs.get_staging_version.outputs.versionTag }}
      registry: roboticsprodacr.azurecr.io
      image_name: ${{ matrix.image_name }}
      author_name: ${{ github.actor }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
    secrets:
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
