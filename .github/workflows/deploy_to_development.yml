name: Deploy to Development

concurrency:
  group: development-concurrency
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - "main"

jobs:
  get-short-sha:
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - id: get-tag
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-8)
          echo "tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"

  build-and-push-dev-images-to-ghcr:
    name: Build and push dev images to github container registry
    needs: [get-short-sha]
    uses: equinor/armada/.github/workflows/build_and_publish_docker_image_to_container_registry.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - image_name: robotics/sara
            path_to_dockerfile: Dockerfile
            path_to_context: .
            short_sha_output: ${{ needs.get-short-sha.outputs.tag }}
            push_to_ghcr: true
          - image_name: robotics/sara-migrations
            path_to_dockerfile: Dockerfile.migrations
            path_to_context: .
            short_sha_output: ${{ needs.get-short-sha.outputs.tag }}
            push_to_ghcr: false
    with:
      registry: roboticsdevacr.azurecr.io
      image_name: ${{ matrix.image_name }}
      tag: "dev.${{ matrix.short_sha_output }}"
      secondary_tag: dev
      push_to_ghcr: ${{ matrix.push_to_ghcr }}
      path_to_dockerfile: ${{ matrix.path_to_dockerfile }}
      path_to_context: ${{ matrix.path_to_context }}
      # Authenticate to the registry with a federated credential instead
      # of the registry password. The environment below is what the OIDC
      # subject binds to on the Azure side.
      environment: Development
      use_oidc: true
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  resolve-dev-digests:
    name: Resolve paired dev image digests
    needs: [build-and-push-dev-images-to-ghcr, get-short-sha]
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      contents: read
      id-token: write
    outputs:
      sara: ${{ steps.resolve.outputs.sara }}
      migrations: ${{ steps.resolve.outputs.migrations }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.ACR_PUSH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve exact commit images
        id: resolve
        env:
          TAG: dev.${{ needs.get-short-sha.outputs.tag }}
        run: |
          set -euo pipefail
          for image in sara sara-migrations; do
            digest=$(az acr manifest show-metadata -r roboticsdevacr -n "robotics/${image}:${TAG}" --query digest -o tsv --only-show-errors)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid digest for $image:$TAG" >&2; exit 1; }
            if [ "$image" = sara ]; then
              echo "sara=$digest" >> "$GITHUB_OUTPUT"
            else
              echo "migrations=$digest" >> "$GITHUB_OUTPUT"
            fi
          done

  deploy:
    name: Update paired deployment in Development
    needs: [resolve-dev-digests, get-short-sha]
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    permissions:
      contents: read
    with:
      environment: development
      registry: roboticsdevacr.azurecr.io
      tag: "dev.${{ needs.get-short-sha.outputs.tag }}"
      image_name: robotics/sara
      paired_image_name: robotics/sara-migrations
      digest: ${{ needs.resolve-dev-digests.outputs.sara }}
      paired_image_digest: ${{ needs.resolve-dev-digests.outputs.migrations }}
      author_name: ${{ github.event.head_commit.author.name }}
      author_email: ${{ github.event.head_commit.author.email }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
    secrets:
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
