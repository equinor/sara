name: Deploy to Development

concurrency:
  group: development-concurrency
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - "main"

jobs:
  run_migrations:
    name: Update database in Development
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: equinor/armada/.github/workflows/run_dotnet_migrations.yml@main
    with:
      environment: Development
      working_directory: api
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  get-short-sha:
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - id: get-tag
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-8)
          echo "tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"

  build-and-push-dev-images-to-ghcr:
    name: Build and push dev images to github container registry
    needs: [get-short-sha]
    uses: equinor/armada/.github/workflows/build_and_publish_docker_image_to_container_registry.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - image_name: robotics/sara
            path_to_dockerfile: Dockerfile
            path_to_context: .
            short_sha_output: ${{ needs.get-short-sha.outputs.tag }}
    with:
      registry: roboticsdevacr.azurecr.io
      image_name: ${{ matrix.image_name }}
      tag: "dev.${{ matrix.short_sha_output }}"
      secondary_tag: dev
      push_to_ghcr: true
      path_to_dockerfile: ${{ matrix.path_to_dockerfile }}
      path_to_context: ${{ matrix.path_to_context }}
      # Authenticate to the registry with a federated credential instead
      # of the registry password. The environment below is what the OIDC
      # subject binds to on the Azure side.
      environment: Development
      use_oidc: true
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy:
    name: Update deployment in Development
    needs: [run_migrations, build-and-push-dev-images-to-ghcr, get-short-sha]
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        include:
          - image_name: robotics/sara
            short_sha_output: ${{ needs.get-short-sha.outputs.tag }}
    with:
      environment: development
      registry: roboticsdevacr.azurecr.io
      image_name: ${{ matrix.image_name }}
      tag: "dev.${{ matrix.short_sha_output }}"
      author_email: ${{ github.event.head_commit.author.email }}
      author_name: ${{ github.event.head_commit.author.name }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
    secrets:
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
