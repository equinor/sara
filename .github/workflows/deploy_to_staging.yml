name: Deploy to Staging

concurrency:
  group: staging-release
  cancel-in-progress: false

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    uses: equinor/armada/.github/workflows/publish_release_images.yml@main
    with:
      image_name: robotics/sara
      paired_image_name: robotics/sara-migrations
      tag: ${{ github.event.release.tag_name }}
      push_to_ghcr: true
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy:
    needs: publish
    if: needs.publish.outputs.is_latest == 'true'
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    with:
      environment: staging
      registry: roboticsstagingacr.azurecr.io
      tag: ${{ github.event.release.tag_name }}
      image_name: robotics/sara
      paired_image_name: robotics/sara-migrations
      author_name: ${{ github.event.release.author.login }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
    secrets:
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
