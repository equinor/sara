name: Deploy to Staging

concurrency:
  group: staging-concurrency
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read

on:
  release:
    types: [published]

jobs:
  run_migrations:
    name: Update database in Staging
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: equinor/armada/.github/workflows/run_dotnet_migrations.yml@main
    with:
      environment: Staging
      checkout_ref: ${{ github.event.release.tag_name }}
      working_directory: api
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  build-and-push-latest-release-images-to-robotics-staging-registry:
    name: Build and push latest release images to robotics staging registry
    uses: equinor/armada/.github/workflows/build_and_publish_docker_image_to_container_registry.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - image_name: robotics/sara
            path_to_dockerfile: Dockerfile
            path_to_context: .
          - image_name: robotics/workflow-notifier
            path_to_dockerfile: workflow-notifier/Dockerfile
            path_to_context: workflow-notifier
    with:
      registry: roboticsstagingacr.azurecr.io
      image_name: ${{ matrix.image_name }}
      tag: "${{ github.event.release.tag_name }}"
      secondary_tag: latest
      push_to_ghcr: true
      path_to_dockerfile: ${{ matrix.path_to_dockerfile }}
      path_to_context: ${{ matrix.path_to_context }}
      # Authenticate to the registry with a federated credential instead
      # of the registry password. The environment below is what the OIDC
      # subject binds to on the Azure side.
      environment: Staging
      use_oidc: true
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy:
    name: Update deployment in Staging
    needs: build-and-push-latest-release-images-to-robotics-staging-registry
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        include:
          - image_name: robotics/sara
          - image_name: robotics/workflow-notifier
    with:
      environment: staging
      registry: roboticsstagingacr.azurecr.io
      image_name: ${{ matrix.image_name }}
      tag: ${{ github.event.release.tag_name }}
      author_name: ${{ github.event.release.author.login }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
    secrets:
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
