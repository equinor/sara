services:
  # Local OpenID Connect issuer, an alternative to Microsoft Entra ID. See README.md.
  # Behind a profile, so the default `docker compose up` is unchanged. The realm is the
  # one the armada integration tests import; override the path with KEYCLOAK_REALM_DIR.
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ${KEYCLOAK_REALM_DIR:-../armada/robotics_integration_tests/custom_realms}:/opt/keycloak/data/import:ro

  sara:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - DISPLAY_URL=http://localhost:8100
      - KeyVault__UseKeyVault=false
      - Database__UseInMemoryDatabase=true
